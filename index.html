
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardik Sharma</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: #111;
  color: #e8e8e8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}
main { padding: 2rem; max-width: 360px; }
h1 {
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #fff;
}
p {
  margin-top: 0.625rem;
  font-size: 0.9375rem;
  line-height: 1.55;
  color: #888;
}
a {
  color: #888;
  text-decoration: none;
  transition: color 0.15s;
}
p a { color: #bbb; }
p a:hover, nav a:hover { color: #fff; }
nav {
  margin-top: 1.5rem;
  display: flex;
  gap: 1.25rem;
  font-size: 0.8125rem;
}
.heart {
  margin-top: 1.5rem;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.25rem 0.65rem 0.25rem 0.45rem;
  border: 0;
  border-radius: 32px;
  background: #232326;
  cursor: pointer;
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #f5f5f5;
}
.heart svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: #8b8b93;
  stroke-width: 2;
  stroke-linejoin: round;
  transform-origin: center;
  animation: beat 1.6s infinite;
}
.heart.on svg {
  fill: #ff4d6d;
  stroke: #ff4d6d;
  animation: pop 560ms cubic-bezier(0.34, 1.7, 0.64, 1);
}
#hearts {
  display: inline-block;
  animation: roll 350ms;
}
@keyframes beat {
  0%, 30%, 100% { transform: scale(1); }
  15% { transform: scale(1.03); }
}
@keyframes pop {
  0% { transform: scale(1); }
  45% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
@keyframes roll {
  from { transform: translateY(0.45em); opacity: 0; }
  to { transform: none; opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .heart svg, #hearts { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Hardik Sharma</h1>
  <p>Software Engineer at <a href="https://www.mxplayer.in" target="_blank">Amazon</a>.</p>
  <nav>
    <a href="https://x.com/hardikksharmaaa" target="_blank">X</a>
    <a href="https://github.com/MPL0Y" target="_blank">GitHub</a>
    <a href="https://linkedin.com/in/hardikksharmaaa" target="_blank">LinkedIn</a>
  </nav>
  <button class="heart" id="heart" aria-label="Leave a heart">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.7 3.8 12.5a5 5 0 1 1 7.1-7.1L12 6.5l1.1-1.1a5 5 0 1 1 7.1 7.1z"/></svg>
    <span id="hearts">&middot;&middot;&middot;</span>
  </button>
</main>
<script>
const btn = document.getElementById('heart');
const out = document.getElementById('hearts');
const replay = (el) => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; };
const show = (r) => r.json().then((d) => { out.textContent = d.n; replay(out); });

fetch('/api/hearts').then(show).catch(() => (out.textContent = ''));

btn.onclick = () => {
    btn.classList.add('on');
    replay(btn.querySelector('svg'));
    fetch('/api/hearts', { method: 'POST' }).then(show);
};
</script>
</body>
</html>
